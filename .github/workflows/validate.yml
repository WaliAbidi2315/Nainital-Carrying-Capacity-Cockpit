name: Validate Streamlit cockpit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app.py
      - name: Validate project artwork and documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse("assets/cover.svg")
          assert "Variable Dictionary & Diagnostics" in Path("app.py").read_text(encoding="utf-8")
          assert Path("README.md").exists()
          print("Application compile, SVG and documentation checks passed.")
          PY
